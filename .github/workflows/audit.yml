# Report releases that never got published (failed producer dispatch,
# cancelled or failed publish run). Read-only and report-only: it checks
# the public endpoint and never publishes, so it does not undo a withdrawal.
name: audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # Until the repository is live every release is "missing". Scheduled runs
    # start once the repository variable APT_AUDIT_ENABLED is set to true.
    if: github.event_name == 'workflow_dispatch' || vars.APT_AUDIT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Audit producers' latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! scripts/audit-producers.sh | tee "$RUNNER_TEMP/audit.txt"; then
            {
              echo "### Unpublished release assets"
              echo
              echo "Re-run the failed publish run, or dispatch publish with the producer and tag."
              echo
              echo '```'
              cat "$RUNNER_TEMP/audit.txt"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Debian names in main
        # Also when the producer audit failed: the two reports are independent.
        if: ${{ !cancelled() }}
        # bash with pipefail, so a failing script is not hidden by tee.
        shell: bash
        run: |
          if ! scripts/audit-debian-names.sh | tee "$RUNNER_TEMP/debian-names.txt"; then
            {
              echo "### Debian names in main"
              echo
              echo "Each line is \`DEBIAN-NAME codename package suites\`: Debian ships a package of that name in those suites for that codename, and Frostyard's main component carries it."
              echo "Such a package belongs in the image component. Moving its producer to image is a reviewed registration change (core ADR-0059); the audit never moves anything. If there are no lines, the audit itself failed: read its log."
              echo
              echo '```'
              cat "$RUNNER_TEMP/debian-names.txt"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
