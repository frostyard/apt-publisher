# Point-in-time rollback: publish a codename from earlier snapshots, one for
# each component it publishes, and rebuild its working repositories from
# them, so later releases build on the rolled-back contents. Everything
# published to the codename after those snapshots is unpublished (republish a
# release to roll it forward). To pull a single version, use withdraw.yml.
# Leave snapshot empty to list snapshots.
name: rollback

on:
  workflow_dispatch:
    inputs:
      codename:
        description: Codename to roll back
        type: choice
        options: [trixie, forky]
      snapshot:
        description: Snapshots to publish, one per component, separated by spaces (empty lists snapshots instead)
        required: false
      force:
        description: Recovery only. Overwrite the bucket even if it does not match aptly's database
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apt-repository
  cancel-in-progress: false
  queue: max

# Explicit bash runs every step with -eo pipefail. Without it, GitHub runs
# `bash -e` with no pipefail, so `script | tee` takes tee's status and a
# failed script passes.
defaults:
  run:
    shell: bash

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: apt-repository
    env:
      CODENAME: ${{ inputs.codename }}
      SNAPSHOT: ${{ inputs.snapshot }}
      FORCE: ${{ inputs.force }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: List snapshots
        if: ${{ inputs.snapshot == '' }}
        run: scripts/switch.sh --list

      - name: Import signing key
        if: ${{ inputs.snapshot != '' }}
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: scripts/import-signing-key.sh

      - name: Roll back
        if: ${{ inputs.snapshot != '' }}
        run: |
          args=(--codename "$CODENAME")
          read -ra names <<<"$SNAPSHOT"
          for name in "${names[@]}"; do args+=(--snapshot "$name"); done
          if [[ $FORCE == true ]]; then args+=(--force); fi
          scripts/switch.sh "${args[@]}"

      - name: Purge CDN cache
        if: ${{ inputs.snapshot != '' }}
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/purge-cache.sh "$CODENAME"
