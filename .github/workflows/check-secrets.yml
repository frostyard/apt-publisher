# Check the apt-repository environment's secrets without publishing, after
# setting or rotating one. See scripts/check-secrets.sh for what each check
# proves.
name: check-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

# It holds the writer's credentials, so it queues with the writers.
concurrency:
  group: apt-repository
  cancel-in-progress: false
  queue: max

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: apt-repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Check secrets
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: scripts/check-secrets.sh
