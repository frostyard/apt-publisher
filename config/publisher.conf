# Non-secret publisher settings, sourced by scripts/lib.sh.
# Every value can be overridden from the environment (tests do this).

# Public bucket that backs https://repository.frostyard.org. aptly owns only
# the APT_PREFIX tree; repogen's legacy dists/stable and pool/ stay untouched.
: "${APT_BUCKET:=frostyardrepo}"
: "${APT_PREFIX:=debian}"
: "${APT_PUBLIC_URL:=https://repository.frostyard.org/debian}"

# Debian's archives, read by the Debian-name audit (core ADR-0059). Security
# updates live on their own host. Tests point these at file:// trees.
: "${APT_DEBIAN_MIRROR:=https://deb.debian.org/debian}"
: "${APT_DEBIAN_SECURITY_MIRROR:=https://security.debian.org/debian-security}"

# Private bucket holding aptly's database and package pool between runs.
: "${APT_STATE_BUCKET:=frostyard-apt-state}"
: "${APT_STATE_PATH:=aptly}"

: "${APT_ORIGIN:=Frostyard}"
: "${APT_LABEL:=Frostyard}"

# Same key that signs the legacy stable suite, so clients keep their keyring.
: "${APT_SIGNING_KEY_FPR:=432C452CD2B7F4FF1B5D23264DE6A2016E622F97}"
: "${APT_KEYRING:=$ROOT/keys/frostyard.gpg}"

: "${APT_CODENAMES_FILE:=$ROOT/config/codenames.tsv}"
: "${APT_PRODUCERS_FILE:=$ROOT/config/producers.tsv}"

# rclone provider for R2. Tests point this at a local S3 server.
: "${APT_RCLONE_PROVIDER:=Cloudflare}"

# Batch withdrawal files, one "NAME VERSION [ARCH]" request row per line, read
# by withdraw.sh and checked by tests/check-config.sh. Tests override it.
: "${APT_WITHDRAWALS_DIR:=$ROOT/withdrawals}"
